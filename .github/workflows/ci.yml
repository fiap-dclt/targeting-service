name: CI/CD Targeting Service

on:
  # Em pushes para a main, executa as verificações antes de publicar no ECR e atualizar o GitOps.
  push:
    branches:
      - main
    paths-ignore:
      - ".github/**"

  # Em pull requests, valida o código e a imagem sem acessar a AWS nem realizar deploy.
  pull_request:
    branches:
      - main
    paths-ignore:
      - ".github/**"

# Preserva as configurações AWS e os caminhos utilizados no workflow original.
env:
  AWS_REGION: "us-east-1"
  ECR_REPOSITORY: "targeting-service"
  REGISTRY_URL: "640494160208.dkr.ecr.us-east-1.amazonaws.com"
  GITOPS_REPO: "fiap-dclt/tech-challenge-phase-3-k8s"
  MANIFEST_PATH: "targeting-service/deployment.yml"

# Permissões mínimas por padrão; apenas o job de build/deploy recebe OIDC.
permissions:
  contents: read

jobs:
  # LINTER: valida padrões de qualidade e boas práticas no código Python.
  lint:
    name: Linter - Ruff
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v7

      # Alinhado ao Python 3.11 utilizado pelo Dockerfile atual do Targeting Service.
      - name: Set Up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      # Versão fixa para tornar os resultados do lint reproduzíveis.
      - name: Install Ruff
        run: python -m pip install ruff==0.17.5

      # Emite anotações diretamente nas linhas afetadas do pull request.
      - name: Run Ruff Linter
        run: ruff check --output-format=github .

  # SCA: analisa o requirements.txt e demais arquivos de dependências.
  # Vulnerabilidades HIGH/CRITICAL com correção disponível bloqueiam o pipeline.
  sca-trivy-fs:
    name: SCA - Trivy FS
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v7

      - name: Run Trivy Filesystem Scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: "."
          scanners: vuln
          vuln-type: os,library
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  # SAST: inspeciona o código-fonte com o Horusec, incluindo analisadores Python.
  # A CLI beta foi a versão que resolveu o erro de detecção do Docker nos serviços anteriores.
  sast-horusec:
    name: SAST - Horusec
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v7

      # Instala a CLI no runner e utiliza o Docker já disponibilizado pelo GitHub Actions.
      - name: Install Horusec CLI
        shell: bash
        run: |
          curl -fsSL \
            https://github.com/ZupIT/horusec/releases/download/v2.9.0-beta.3/horusec_linux_amd64 \
            -o horusec
          sudo install -m 755 horusec /usr/local/bin/horusec
          horusec version
          docker version

      # -e true faz com que vulnerabilidades bloqueantes resultem em falha do job.
      - name: Run Horusec SAST Scan
        shell: bash
        run: horusec start -p "$GITHUB_WORKSPACE" -e true

  # SECRET SCANNING: identifica chaves, tokens e senhas potencialmente expostos.
  # O histórico completo é necessário para inspecionar também commits anteriores.
  secrets-gitleaks:
    name: Secret Scanning - Gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Full Git History
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Scan Git History for Secrets
        shell: bash
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/repo" \
            -w /repo \
            ghcr.io/gitleaks/gitleaks:v8.30.1 \
            git --redact --verbose .

  # BUILD E DEPLOY: só inicia depois da aprovação dos quatro jobs de segurança.
  # Sempre analisa a imagem Docker localmente antes de qualquer publicação no ECR.
  # Em pull requests, constrói e analisa; em push na main, também publica e atualiza o GitOps.
  build-and-update-gitops:
    name: Build, Image Scan and GitOps Deploy
    runs-on: ubuntu-latest
    needs:
      - lint
      - sca-trivy-fs
      - sast-horusec
      - secrets-gitleaks
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v7

      # Atualiza as imagens-base e gera a imagem com o SHA imutável do commit.
      # O endereço ECR é usado como tag local; ainda não há push para a AWS.
      - name: Build Docker Image
        shell: bash
        run: |
          docker build --pull \
            -t "${REGISTRY_URL}/${ECR_REPOSITORY}:${GITHUB_SHA}" \
            .

      # Verifica vulnerabilidades HIGH/CRITICAL nas dependências e no sistema operacional.
      # Se houver achados bloqueantes, os steps de autenticação e publicação não executam.
      - name: Run Trivy Image Scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: ${{ env.REGISTRY_URL }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
          scanners: vuln
          vuln-type: os,library
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      # Usa OIDC, sem credenciais AWS permanentes, apenas em pushes na branch main.
      - name: Authenticate to AWS (OIDC)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::640494160208:role/github-actions-ecr-role-prod
          aws-region: ${{ env.AWS_REGION }}

      - name: Log In to Amazon ECR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: aws-actions/amazon-ecr-login@v2

      # O push é permitido somente quando todos os scans anteriores passaram.
      - name: Push Docker Image to ECR
        id: push-image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          IMAGE_REF="${REGISTRY_URL}/${ECR_REPOSITORY}:${GITHUB_SHA}"
          docker push "$IMAGE_REF"
          echo "new_image=$IMAGE_REF" >> "$GITHUB_OUTPUT"

      # Faz checkout do repositório GitOps usando o PAT já configurado no repositório.
      - name: Checkout GitOps Repository
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/checkout@v7
        with:
          repository: ${{ env.GITOPS_REPO }}
          token: ${{ secrets.GITOPS_PAT }}
          path: gitops-repo

      # Atualiza exclusivamente a imagem targeting-service no deployment Kubernetes.
      - name: Update Image Tag in Deployment Manifest
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          NEW_IMAGE: ${{ steps.push-image.outputs.new_image }}
        run: |
          cd gitops-repo
          sed -i "s|image: ${REGISTRY_URL}/${ECR_REPOSITORY}:.*|image: ${NEW_IMAGE}|g" "$MANIFEST_PATH"
          if ! grep -Fq "image: ${NEW_IMAGE}" "$MANIFEST_PATH"; then
            echo "Unable to update the image in $MANIFEST_PATH" >&2
            exit 1
          fi

      # Faz o commit somente se houve modificação e tenta publicar até cinco vezes.
      - name: Commit and Push GitOps Changes
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          cd gitops-repo
          git config user.name "github-actions-bot"
          git config user.email "bot@github.com"
          git add "$MANIFEST_PATH"
          if git diff --cached --quiet; then
            echo "GitOps manifest already references this image."
            exit 0
          fi
          git commit -m "chore: deploy(targeting-service) bump image to ${GITHUB_SHA}"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main
            if git push origin main; then
              exit 0
            fi
            sleep 5
          done
          echo "Failed to push GitOps changes after 5 attempts." >&2
          exit 1
